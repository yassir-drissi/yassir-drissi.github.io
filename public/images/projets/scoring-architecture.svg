<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Geist, 'Segoe UI', system-ui, sans-serif">
  <title>Credit scoring app architecture: Next.js, FastAPI, CatBoost, SHAP, Docker</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1220" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f6f8fc"/>

  <!-- Utilisateur -->
  <g transform="translate(70 360)">
    <circle cx="70" cy="50" r="34" fill="#e0e9ff"/>
    <circle cx="70" cy="40" r="13" fill="#2563eb"/>
    <path d="M44 74 a26 22 0 0 1 52 0" fill="#2563eb"/>
    <text x="70" y="128" text-anchor="middle" font-size="24" font-weight="700" fill="#0b1220">Credit agent</text>
    <text x="70" y="158" text-anchor="middle" font-size="20" fill="#475569">or admin</text>
  </g>

  <!-- Frontière Docker -->
  <rect x="270" y="110" width="1270" height="680" rx="28" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="14 10"/>
  <rect x="300" y="88" width="140" height="44" rx="22" fill="#0b1220"/>
  <text x="370" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Docker</text>

  <!-- Next.js -->
  <g filter="url(#shadow)">
    <rect x="320" y="300" width="330" height="270" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <rect x="320" y="300" width="330" height="10" rx="5" fill="#0b1220"/>
  <text x="485" y="370" text-anchor="middle" font-size="36" font-weight="800" fill="#0b1220">Next.js</text>
  <text x="485" y="408" text-anchor="middle" font-size="21" fill="#475569">Web interface</text>
  <text x="485" y="462" text-anchor="middle" font-size="20" fill="#0b1220">• Loan application form</text>
  <text x="485" y="494" text-anchor="middle" font-size="20" fill="#0b1220">• Agent / admin areas</text>
  <text x="485" y="526" text-anchor="middle" font-size="20" fill="#0b1220">• Request history</text>

  <!-- FastAPI -->
  <g filter="url(#shadow)">
    <rect x="760" y="300" width="330" height="270" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <rect x="760" y="300" width="330" height="10" rx="5" fill="#059669"/>
  <text x="925" y="370" text-anchor="middle" font-size="36" font-weight="800" fill="#0b1220">FastAPI</text>
  <text x="925" y="408" text-anchor="middle" font-size="21" fill="#475569">REST API</text>
  <text x="925" y="462" text-anchor="middle" font-size="20" fill="#0b1220">• Authentication</text>
  <text x="925" y="494" text-anchor="middle" font-size="20" fill="#0b1220">• Prediction</text>
  <text x="925" y="526" text-anchor="middle" font-size="20" fill="#0b1220">• History</text>

  <!-- Modèle -->
  <g filter="url(#shadow)">
    <rect x="1180" y="170" width="320" height="200" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <rect x="1180" y="170" width="320" height="10" rx="5" fill="#2563eb"/>
  <text x="1340" y="236" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1220">CatBoost</text>
  <text x="1340" y="276" text-anchor="middle" font-size="20" fill="#475569">Probability of default</text>
  <text x="1340" y="320" text-anchor="middle" font-size="20" fill="#0b1220">Cost-matrix threshold</text>
  <text x="1340" y="348" text-anchor="middle" font-size="20" fill="#0b1220">→ accept / reject</text>

  <!-- SHAP -->
  <g filter="url(#shadow)">
    <rect x="1180" y="500" width="320" height="200" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <rect x="1180" y="500" width="320" height="10" rx="5" fill="#db2777"/>
  <text x="1340" y="566" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1220">SHAP</text>
  <text x="1340" y="606" text-anchor="middle" font-size="20" fill="#475569">Explanation per application</text>
  <g transform="translate(1235 630)">
    <rect x="0" y="0" width="150" height="14" rx="7" fill="#db2777"/>
    <rect x="0" y="22" width="105" height="14" rx="7" fill="#f472b6"/>
    <rect x="0" y="44" width="70" height="14" rx="7" fill="#fbcfe8"/>
    <text x="165" y="13" font-size="16" fill="#475569">top factors</text>
  </g>

  <!-- Flèches -->
  <path d="M200 435 H312" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M650 410 H752" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M752 460 H658" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="701" y="396" text-anchor="middle" font-size="17" fill="#475569">request</text>
  <text x="701" y="492" text-anchor="middle" font-size="17" fill="#475569">decision</text>
  <path d="M1090 380 C1135 380 1135 270 1172 270" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1090 490 C1135 490 1135 600 1172 600" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <text x="800" y="850" text-anchor="middle" font-size="20" fill="#64748b">Model trained on 307,511 Home Credit applications · AUC 0.76 (Gini 0.52)</text>
</svg>
